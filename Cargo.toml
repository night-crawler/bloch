[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/night-crawler/bloch"

[workspace.dependencies]
bloch = { path = "crates/bloch", version = "0.1.0" }
bloch-derive = { path = "crates/bloch-derive", version = "0.1.0" }

bstr = "1"
chrono = "0.4"
chrono-tz = "0.10"
half = { version = "2.6", features = ["zerocopy"] }
log = "0.4"
mimalloc = "0.1"
nom = { version = "8", features = ["std"] }
paste = "1"
proc-macro-crate = "3"
proc-macro2 = "1"
quote = "1"
rust_decimal = "1.37.1"
rustc-hash = "2"
serde = "1"
syn = { version = "2", features = ["full"] }
thiserror = "2"
uuid = "1.16"
zerocopy = { version = "0.8", features = ["std", "derive"] }

# clickhouse-rs does not expose deserialize row interface, so to make a benchmark, I had
# to fork and expose it
clickhouse = { git = "https://github.com/night-crawler/clickhouse-rs", branch = "main", features = ["chrono", "uuid"] }
criterion = "0.8"
env_logger = "0.11"
flate2 = "1"
pretty_assertions = "1.4"
serde_json = "1"
testresult = "0.4"

[profile.release]
debug = true
strip = "none"
codegen-units = 1
lto = "fat"

[profile.bench]
inherits = "release"
debug = true
strip = "none"

[workspace.lints.clippy]
allow_attributes = "deny"
as_pointer_underscore = "deny"
as_underscore = "deny"
borrow_as_ptr = "deny"
cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_ptr_alignment = "deny"
cast_sign_loss = "deny"
clone_on_ref_ptr = "deny"
cloned_instead_of_copied = "deny"
comparison_chain = "deny"
debug_assert_with_mut_call = "deny"
elidable_lifetime_names = "deny"
enum_glob_use = "deny"
equatable_if_let = "deny"
explicit_into_iter_loop = "deny"
explicit_iter_loop = "deny"
filter_map_next = "deny"
flat_map_option = "deny"
format_collect = "deny"
format_push_string = "deny"
ignored_unit_patterns = "deny"
implicit_clone = "deny"
inefficient_to_string = "deny"
items_after_statements = "deny"
iter_on_empty_collections = "deny"
iter_on_single_items = "deny"
iter_with_drain = "deny"
manual_is_variant_and = "deny"
manual_let_else = "deny"
manual_midpoint = "deny"
match_same_arms = "deny"
missing_const_for_fn = "deny"
module_name_repetitions = "deny"
multiple_inherent_impl = "deny"
needless_pass_by_value = "deny"
or_fun_call = "deny"
rc_buffer = "deny"
redundant_closure_for_method_calls = "deny"
redundant_pub_crate = "deny"
redundant_test_prefix = "deny"
ref_option = "deny"
ref_option_ref = "deny"
str_to_string = "deny"
suboptimal_flops = "deny"
uninlined_format_args = "allow"
unnecessary_self_imports = "deny"
unneeded_field_pattern = "deny"
unnested_or_patterns = "deny"
unused_trait_names = "deny"

[workspace.lints.rust]
unfulfilled_lint_expectations = "deny"
